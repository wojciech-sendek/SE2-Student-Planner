services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: student-planner-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-YourStrongPassword!123}
      - MSSQL_PID=${MSSQL_PID:-Developer}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -C"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - student-planner-net

  api:
    build:
      context: .
      dockerfile: StudentPlanner.Api/Dockerfile
    container_name: student-planner-api
    depends_on:
      database:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=database;Database=${MSSQL_DATABASE:-StudentPlannerDb};User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrongPassword!123};TrustServerCertificate=True;
      - Cors__Origins=["http://localhost:5173", "http://localhost"]
      - Smtp__Host=mailpit
      - Smtp__Port=1025
    ports:
      - "${API_PORT:-5289}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - student-planner-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: student-planner-web
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - student-planner-net
    depends_on:
      api:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit
    container_name: student-planner-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - student-planner-net

volumes:
  mssql-data:

networks:
  student-planner-net:
    driver: bridge
